; Interactive Dance wearable sensors: PlatformIO project.
; Build from this folder:  pio run -e wearable
; See README.md for the structure and what is hardware-verified.

[platformio]
default_envs = wearable

; Settings shared by every environment.
[env]
framework = arduino
monitor_speed = 115200

; Wearable: Seeed Studio XIAO ESP32-C6.
; The official espressif32 platform supports this board only with ESP-IDF, so
; the Arduino framework comes from the community pioarduino platform (Arduino
; core 3.x), pinned to one release so every machine builds the same thing.
[env:wearable]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32c6
build_src_filter = +<wearable/>
; The board definition already enables USB CDC serial on boot (Serial = USB).
build_flags =
    -D DANCE_WEARABLE_FIRMWARE

; Receiver: deliberately not configured yet. The receiver board has not been
; confirmed; add [env:receiver] with its platform and board once it is, using
;   build_src_filter = +<receiver/>
