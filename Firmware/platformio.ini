; Interactive Dance wearable sensors: PlatformIO project.
; Build from this folder:  pio run -e wearable   (or wearable2, wearable3, receiver)
; See README.md for the structure and what is hardware-verified.

[platformio]
default_envs = wearable

; Settings shared by every environment.
[env]
framework = arduino
monitor_speed = 115200

; Wearable: Seeed Studio XIAO ESP32-C6.
; The official espressif32 platform supports this board only with ESP-IDF, so
; the Arduino framework comes from the community pioarduino platform (Arduino
; core 3.x), pinned to one release so every machine builds the same thing.
[env:wearable]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32c6
build_src_filter = +<wearable/>
; The board definition already enables USB CDC serial on boot (Serial = USB).
build_flags =
    -D DANCE_WEARABLE_FIRMWARE

; The same firmware with wearable ids 2 and 3 (env:wearable is id 1). Every
; wearable needs its own id: two with the same id show as "DUP" on the receiver.
[env:wearable2]
extends = env:wearable
build_flags =
    ${env:wearable.build_flags}
    -D DANCE_WEARABLE_ID=2

[env:wearable3]
extends = env:wearable
build_flags =
    ${env:wearable.build_flags}
    -D DANCE_WEARABLE_ID=3

; Receiver: LOLIN NodeMCU V3 (ESP8266, CH340 USB chip). Receives the
; wearables' ESP-NOW packets, prints them as serial lines for TouchDesigner and
; shows status on a 1.8" ST7735 display. Pinned versions, as for the wearable.
[env:receiver]
platform = espressif8266@4.2.1
board = nodemcuv2
build_src_filter = +<receiver/>
monitor_speed = 921600
upload_speed = 460800
lib_deps =
    adafruit/Adafruit GFX Library@1.12.1
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
